<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Character encoding for the page -->
    <meta charset="UTF-8" />
    
    <!-- Favicon (small icon shown in browser tab) -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Makes the page responsive on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Page title shown in browser tab -->
    <title>SMMS - Student Mentoring Management System</title>
    
    <!-- 
      GOOGLE FONTS - Lexend 
      This is the main font we use throughout the app
      We import different weights (300-700) for various text styles
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    
    <!-- 
      MATERIAL SYMBOLS (Icons)
      These are the icons we use for buttons, navigation, etc.
      Example: dashboard icon, user icon, settings icon
    -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  </head>
  
  <body>
    <!-- 
      ROOT DIV
      This is where our entire React app will be rendered
      React takes control of this element and puts all our components inside it
    -->
    <div id="root"></div>
    
    <!-- 
      MAIN JAVASCRIPT FILE
      This loads our React application
      The /src/main.jsx is the entry point of our app
    -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
